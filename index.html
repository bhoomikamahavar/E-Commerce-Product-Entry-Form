<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Commerce Product Entry Form</title>
    <!-- bootstrap css -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <div class="container" id="productID">
        <div class="row">
            <div class="col-lg-6 col-md-6 col-12">
                <h2 class="mb-3">Add New Product</h2>
                <form id="add_new_product">
                    <div class="mb-3">
                        <label for="p_name">Product Name</label><br />
                        <input type="text" class="form-control" id="p_name" name="p_name" placeholder="Product Name" required>
                    </div>
                    <div class="mb-3">
                        <label for="p_price">Price</label><br />
                        <input type="text" class="form-control" id="p_price" name="p_price" placeholder="Price" required>
                    </div>
                    <div class="mb-3">
                        <label for="p_description">Description</label><br />
                        <input type="text" class="form-control" id="p_description" name="p_description" placeholder="Description" required>
                    </div>
                    <div class="mb-3">
                        <label for="p_image">Image</label><br />
                        <input type="file" class="form-control" id="p_image" name="p_image" accept="image/*" required>
                    </div>
                    <div class="mb-3">
                        <label for="p_category">Category</label><br />
                        <select id="p_category" name="p_category" class="form-select" required>
                            <option value="">Choose...</option>
                            <option value="electronics">Electronics</option>
                            <option value="clothing">Clothing</option>
                            <option value="furniture">Furniture</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Rating</label>
                        <div class="star-rating">
                            <input type="radio" id="r5" name="p_rating" value="5"><label for="r5">★</label>
                            <input type="radio" id="r4" name="p_rating" value="4"><label for="r4">★</label>
                            <input type="radio" id="r3" name="p_rating" value="3"><label for="r3">★</label>
                            <input type="radio" id="r2" name="p_rating" value="2"><label for="r2">★</label>
                            <input type="radio" id="r1" name="p_rating" value="1"><label for="r1">★</label>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="p_warranty_period">Warranty Period</label><br />
                        <select id="p_warranty_period" name="p_warranty_period" class="form-select" required>
                            <option value="">Select warranty</option>
                            <option value="no_warranty">No Warranty</option>
                            <option value="7_days">7 Days</option>
                            <option value="15_days">15 Days</option>
                            <option value="30_days">30 Days</option>
                            <option value="3_months">3 Months</option>
                            <option value="6_months">6 Months</option>
                            <option value="12_months">12 Months</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="p_company_name">Company Name</label><br />
                        <input type="text" class="form-control" id="p_company_name" name="p_company_name" placeholder="Company Name" required>
                    </div>
                    <div class="mb-3">
                        <label for="p_return_policy">Return Policy</label><br />
                        <select id="p_return_policy" name="p_return_policy" class="form-select" required>
                            <option value="">Select return policy</option>
                            <option value="no_return">No Return</option>
                            <option value="7_days">7 Days Return</option>
                            <option value="10_days">10 Days Return</option>
                            <option value="15_days">15 Days Return</option>
                            <option value="30_days">30 Days Return</option>
                            <option value="replacement_only">Replacement Only</option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-primary">Submit</button>
                </form>
            </div>
            <div class="col-lg-6 col-md-6 col-12">
                <div id="productBox">
                </div>
            </div>
        </div>
    </div>
    <!-- bootstrap js -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="./script.js"></script>
</body>

</html>
